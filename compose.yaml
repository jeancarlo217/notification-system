services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_DATABASE_PATH: /data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    command: sh -c "python manage.py migrate --noinput && gunicorn deadliner.wsgi --bind 0.0.0.0:8000"
    # The single route outside the secret path segment, and it touches no dependency
    # (foundation section 6). It answers on the loopback name, which DJANGO_ALLOWED_HOSTS
    # must therefore carry.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The daily scheduler (foundation section 5): the engine outside the web process, no queue.
  # A plain loop is enough because I1 makes a duplicate run harmless and I3 makes a late run
  # cost lateness only; the hourly retry after a failure is "late beats never" for the run
  # itself. Shape recorded in specs/adr/0002-scheduler-container.md.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DATABASE_PATH: /data/db.sqlite3
    volumes:
      - data:/data
    depends_on:
      - web
    command: sh -c "while true; do if python manage.py send_alerts; then sleep 86400; else sleep 3600; fi; done"

  # Evolution API and its own dependencies (foundation section 4, OQ-1). Opaque to the
  # application: web talks to it only through the provider adapter (B8).
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?set EVOLUTION_DB_PASSWORD in .env}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Vale Verde Ambiental
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN,INFO

  evolution-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?set EVOLUTION_DB_PASSWORD in .env}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  data:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
