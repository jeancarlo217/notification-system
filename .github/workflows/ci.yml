name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # CI-only values so settings can load; none is a credential (foundation I5).
      DJANGO_SECRET_KEY: ci-only-value-not-a-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      DEADLINER_ALERT_THRESHOLDS: "30,7,0"
      DEADLINER_WHATSAPP_NUMBER: "5500000000000"
      DEADLINER_MESSAGE_TEMPLATE: "{client} {service} {due_date} {days_remaining}"
      DEADLINER_SECRET_PATH_SEGMENT: ci-only-segment-not-a-secret
      DEADLINER_TIMEZONE: America/Campo_Grande
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
