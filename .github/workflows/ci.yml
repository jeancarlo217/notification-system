name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # CI-only values so settings can load; none is a credential (foundation I5).
      DJANGO_SECRET_KEY: ci-only-value-not-a-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      DEADLINER_SEND_TIME: "07:00"
      DEADLINER_WHATSAPP_DESTINATION: "5500000000000"
      DEADLINER_MESSAGE_HEADER: "{date} {count}"
      DEADLINER_MESSAGE_TEMPLATE: "{client} {service} {due_date} {deadline}"
      DEADLINER_DEADLINE_FUTURE: "in {days}"
      DEADLINER_DEADLINE_TOMORROW: "tomorrow"
      DEADLINER_DEADLINE_TODAY: "today"
      DEADLINER_DEADLINE_YESTERDAY: "yesterday"
      DEADLINER_DEADLINE_OVERDUE: "{days} ago"
      DEADLINER_SECRET_PATH_SEGMENT: ci-only-segment-not-a-secret
      DEADLINER_TIMEZONE: America/Campo_Grande
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # WhiteNoise warns once per middleware construction when STATIC_ROOT is absent, and a
      # warning nobody can silence is a warning nobody reads.
      - run: python manage.py collectstatic --noinput
      - run: pytest
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
