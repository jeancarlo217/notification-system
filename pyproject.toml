# Tool configuration only. Dependencies live in requirements.txt and requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["core/migrations", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
files = ["deadliner", "core", "tests", "manage.py"]
exclude = ["^core/migrations/"]

[tool.django-stubs]
django_settings_module = "deadliner.settings"

[tool.pytest.ini_options]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "deadliner.settings"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
