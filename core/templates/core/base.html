<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prazos{% endblock %} | Vale Verde Ambiental</title>
  {% include "core/_styles.html" %}
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="{% url 'service-list' %}">
        <span class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5c4.2 3 6.5 6.2 6.5 10.1A6.5 6.5 0 0 1 12 20.5a6.5 6.5 0 0 1-6.5-6.9C5.5 9.7 7.8 6.5 12 3.5z"/>
            <path d="M12 20.5V8.5"/>
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__title">Prazos de serviços</span>
          <span class="brand__org">Vale Verde Ambiental</span>
        </span>
      </a>
    </div>
  </header>
  <main class="shell" id="conteudo">
    {% block content %}{% endblock %}
  </main>
  {% include "core/_scripts.html" %}
</body>
</html>
