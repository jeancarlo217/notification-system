{% extends "core/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <h2>{{ title }}</h2>
  {% if service %}
    <p>{{ service.client }}: {{ service.description }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">{{ action }}</button>
    <a href="{% url 'service-list' %}">Cancelar</a>
  </form>
{% endblock %}
